<section id="accuracy-ui" class="accuracy-ui" aria-label="FeedFrame sharing goals">
    <div id="banner" class="banner" aria-live="polite"></div>
</section>
<details id="demo-controls" class="demo-controls">
    <summary>Demo settings</summary>
    <div class="demo-controls-body">
        <label for="version">Condition</label>
        <select id="version">
            <option value="control">Control</option>
            <option value="goals" selected>Accuracy+</option>
            <option value="plan">Accuracy+ Plan</option>
            <option value="importance">Accuracy Importance</option>
        </select>
        <button type="button" id="edit" class="quiet">Edit sharing goal</button>
        <button type="button" id="restart" class="quiet">Start over</button>
        <button type="button" id="hide-controls" class="quiet">Hide for screenshot</button>
        <small>Press H to show or hide settings.</small>
    </div>
</details>
